name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ["1.21"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Install LLVM (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18 llvm-18-dev libllvm18 || \
          sudo apt-get install -y llvm llvm-dev

      - name: Install LLVM (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install llvm@15

      - name: Install LLVM (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install llvm --version=15.0.7

      - name: Get dependencies
        run: |
          cd src
          go get -v -t -d ./...

      - name: Build
        run: |
          cd src
          go build -v .

      - name: Run tests
        run: |
          cd src
          go test -v -timeout 0 ./...

      - name: Test compilation examples (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd src
          go build -o ../lotus .
          cd ..
          ./lotus -o test_if examples/control_flow_if.lts
          ./lotus -o test_for examples/control_flow_for.lts
          ./lotus -o test_while examples/control_flow_while.lts

      - name: Test compilation examples (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd src
          go build -o ../lotus.exe .
          cd ..
          ./lotus.exe -o test_if.exe examples/control_flow_if.lts
          ./lotus.exe -o test_for.exe examples/control_flow_for.lts
          ./lotus.exe -o test_while.exe examples/control_flow_while.lts

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Run go fmt
        run: |
          cd src
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted:"
            gofmt -d .
            exit 1
          fi

      - name: Run go vet
        run: |
          cd src
          go vet ./...

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Install LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18 llvm-18-dev libllvm18 || \
          sudo apt-get install -y llvm llvm-dev

      - name: Check build for multiple architectures
        run: |
          cd src
          GOOS=linux GOARCH=amd64 go build -v .
          GOOS=linux GOARCH=arm64 go build -v .
          GOOS=darwin GOARCH=amd64 go build -v .
          GOOS=darwin GOARCH=arm64 go build -v .
          GOOS=windows GOARCH=amd64 go build -v .
