name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
        go-version: ["1.21"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Install LLVM (Ubuntu)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # Install LLVM 18 (available in Ubuntu 24.04 repos)
          sudo apt-get install -y llvm-18 llvm-18-dev libllvm18
          # Remove ALL other LLVM versions to prevent go-llvm from detecting them
          sudo rm -rf /usr/lib/llvm-* 2>/dev/null || true
          sudo rm -rf /usr/local/lib/llvm-* 2>/dev/null || true
          # Reinstall LLVM 18 after cleanup
          sudo apt-get install --reinstall -y llvm-18 llvm-18-dev libllvm18
          # Set environment variables for LLVM 18 only
          {
            echo "CGO_CPPFLAGS=-I/usr/lib/llvm-18/include"
            echo "CGO_LDFLAGS=-L/usr/lib/llvm-18/lib -lLLVM-18"
            echo "PATH=/usr/lib/llvm-18/bin:$PATH"
          } >> $GITHUB_ENV
          # Create symlink to make llvm-config point to version 18
          sudo ln -sf /usr/lib/llvm-18/bin/llvm-config /usr/bin/llvm-config

      - name: Install LLVM (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install llvm@15
          LLVM_PATH=$(brew --prefix llvm@15)
          echo "CGO_CPPFLAGS=-I${LLVM_PATH}/include" >> $GITHUB_ENV
          echo "CGO_LDFLAGS=-L${LLVM_PATH}/lib" >> $GITHUB_ENV

      - name: Install LLVM (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install llvm --version=15.0.7
          echo "CGO_CPPFLAGS=-IC:/Program Files/LLVM/include" >> $GITHUB_ENV
          echo "CGO_LDFLAGS=-LC:/Program Files/LLVM/lib" >> $GITHUB_ENV

      - name: Get dependencies
        run: |
          cd src
          # Clean Go module cache to ensure go-llvm recompiles with correct LLVM version
          go clean -modcache
          go get -v -t -d ./...

      - name: Build
        run: |
          cd src
          go build -v .

      - name: Run tests
        run: |
          cd src
          go test -v -timeout 0 ./...

      - name: Test compilation examples (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd src
          go build -o ../lotus .
          cd ..
          ./lotus -o test_if examples/control_flow_if.lts
          ./lotus -o test_for examples/control_flow_for.lts
          ./lotus -o test_while examples/control_flow_while.lts

      - name: Test compilation examples (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd src
          go build -o ../lotus.exe .
          cd ..
          ./lotus.exe -o test_if.exe examples/control_flow_if.lts
          ./lotus.exe -o test_for.exe examples/control_flow_for.lts
          ./lotus.exe -o test_while.exe examples/control_flow_while.lts

  lint:
    name: Lint
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Install LLVM
        run: |
          sudo apt-get update
          # Install LLVM 18 (available in Ubuntu 24.04 repos)
          sudo apt-get install -y llvm-18 llvm-18-dev libllvm18
          # Remove ALL other LLVM versions to prevent go-llvm from detecting them
          sudo rm -rf /usr/lib/llvm-* 2>/dev/null || true
          sudo rm -rf /usr/local/lib/llvm-* 2>/dev/null || true
          # Reinstall LLVM 18 after cleanup
          sudo apt-get install --reinstall -y llvm-18 llvm-18-dev libllvm18
          # Set environment variables for LLVM 18 only
          {
            echo "CGO_CPPFLAGS=-I/usr/lib/llvm-18/include"
            echo "CGO_LDFLAGS=-L/usr/lib/llvm-18/lib -lLLVM-18"
            echo "PATH=/usr/lib/llvm-18/bin:$PATH"
          } >> $GITHUB_ENV
          # Create symlink to make llvm-config point to version 18
          sudo ln -sf /usr/lib/llvm-18/bin/llvm-config /usr/bin/llvm-config

      - name: Run go fmt
        run: |
          cd src
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted:"
            gofmt -d .
            exit 1
          fi

      - name: Run go vet
        run: |
          cd src
          go vet ./...

  build-check:
    name: Build Check
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Install LLVM
        run: |
          sudo apt-get update
          # Install LLVM 18 (available in Ubuntu 24.04 repos)
          sudo apt-get install -y llvm-18 llvm-18-dev libllvm18
          # Remove ALL other LLVM versions to prevent go-llvm from detecting them
          sudo rm -rf /usr/lib/llvm-* 2>/dev/null || true
          sudo rm -rf /usr/local/lib/llvm-* 2>/dev/null || true
          # Reinstall LLVM 18 after cleanup
          sudo apt-get install --reinstall -y llvm-18 llvm-18-dev libllvm18
          # Set environment variables for LLVM 18 only
          {
            echo "CGO_CPPFLAGS=-I/usr/lib/llvm-18/include"
            echo "CGO_LDFLAGS=-L/usr/lib/llvm-18/lib -lLLVM-18"
            echo "PATH=/usr/lib/llvm-18/bin:$PATH"
          } >> $GITHUB_ENV
          # Create symlink to make llvm-config point to version 18
          sudo ln -sf /usr/lib/llvm-18/bin/llvm-config /usr/bin/llvm-config

      - name: Check build
        run: |
          cd src
          # Native build only - cross-compilation requires platform-specific LLVM
          go build -v .
