name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        go-version: ["1.21"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Install LLVM and SDL3 (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install llvm@18 sdl3
          LLVM_PATH=$(brew --prefix llvm@18)
          SDL3_PATH=$(brew --prefix sdl3)
          echo "CGO_CPPFLAGS=-I${LLVM_PATH}/include" >> $GITHUB_ENV
          echo "CGO_LDFLAGS=-L${LLVM_PATH}/lib" >> $GITHUB_ENV
          echo "LIBRARY_PATH=${LIBRARY_PATH}:${SDL3_PATH}/lib" >> $GITHUB_ENV

      - name: Install LLVM and SDL3 (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install llvm --version=18.1.8 --allow-downgrade --force
          # Download and install SDL3
          Invoke-WebRequest -Uri "https://github.com/libsdl-org/SDL/releases/download/preview-3.1.6/SDL3-3.1.6-win32-x64.zip" -OutFile "SDL3.zip"
          Expand-Archive -Path "SDL3.zip" -DestinationPath "C:\SDL3"
          echo "CGO_CPPFLAGS=-IC:/PROGRA~1/LLVM/include" >> $env:GITHUB_ENV
          echo "CGO_LDFLAGS=-LC:/PROGRA~1/LLVM/lib" >> $env:GITHUB_ENV
          echo 'C:/Program Files/LLVM/bin' >> $env:GITHUB_PATH
          echo 'C:\SDL3\SDL3-3.1.6-win32-x64\bin' >> $env:GITHUB_PATH
          echo 'LIB=C:\SDL3\SDL3-3.1.6-win32-x64\lib\x64' >> $env:GITHUB_ENV

      - name: Get dependencies
        run: |
          cd src
          go get -v -t -d ./...

      - name: Build
        run: |
          cd src
          go build -v .

      - name: Run tests
        run: |
          cd src
          go test -v -timeout 0 ./...

      - name: Test compilation examples (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          cd src
          go build -o ../lotus .
          cd ..
          ./lotus -o test_if examples/control_flow_if.lts
          ./lotus -o test_for examples/control_flow_for.lts
          ./lotus -o test_while examples/control_flow_while.lts

      - name: Test compilation examples (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd src
          go build -o ../lotus.exe .
          cd ..
          ./lotus.exe -o test_if.exe examples/control_flow_if.lts
          ./lotus.exe -o test_for.exe examples/control_flow_for.lts
          ./lotus.exe -o test_while.exe examples/control_flow_while.lts

  lint:
    name: Lint
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Install LLVM and SDL3
        run: |
          brew install llvm@18 sdl3
          LLVM_PATH=$(brew --prefix llvm@18)
          SDL3_PATH=$(brew --prefix sdl3)
          echo "CGO_CPPFLAGS=-I${LLVM_PATH}/include" >> $GITHUB_ENV
          echo "CGO_LDFLAGS=-L${LLVM_PATH}/lib" >> $GITHUB_ENV
          echo "LIBRARY_PATH=${LIBRARY_PATH}:${SDL3_PATH}/lib" >> $GITHUB_ENV

      - name: Run go fmt
        run: |
          cd src
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted:"
            gofmt -d .
            exit 1
          fi

      - name: Run go vet
        run: |
          cd src
          go vet ./...
